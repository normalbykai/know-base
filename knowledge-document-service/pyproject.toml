[project]
name = "knowledge-document-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "minio>=7.2,<8",
  "dramatiq[redis]>=1.17,<2", "httpx>=0.27,<1", "python-multipart>=0.0.12,<1", "alembic>=1.14,<2", "pymupdf>=1.24,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
