services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  document-api:
    build: ./knowledge-document-service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: ./knowledge-document-service/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DOCUMENT_PARSER: ${DOCUMENT_PARSER:-deepseek_vision}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-flash}
      # 保留本地 MinerU 备用解析服务；当前默认路由使用 DeepSeek Vision。
      MINERU_BASE_URL: http://mineru:8000
    ports: ["${API_PORT:-8000}:8000"]
    volumes: [./knowledge-document-service:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  document-worker:
    build: ./knowledge-document-service
    command: dramatiq app.workers.parse_worker
    env_file: ./knowledge-document-service/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DOCUMENT_PARSER: ${DOCUMENT_PARSER:-deepseek_vision}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_VISION_MODEL: ${DEEPSEEK_VISION_MODEL:-deepseek-flash}
      MINERU_BASE_URL: http://mineru:8000
    volumes: [./knowledge-document-service:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  # 独立扫描卡死任务，避免 Worker 或外部解析服务异常后文档永久停在 PARSING。
  document-task-recovery:
    build: ./knowledge-document-service
    command: python -m app.workers.task_recovery
    restart: unless-stopped
    env_file: ./knowledge-document-service/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge
      PARSE_TASK_TIMEOUT_SECONDS: ${PARSE_TASK_TIMEOUT_SECONDS:-5400}
      TASK_RECOVERY_INTERVAL_SECONDS: ${TASK_RECOVERY_INTERVAL_SECONDS:-60}
    volumes: [./knowledge-document-service:/app]
    depends_on:
      postgres: { condition: service_healthy }

  # 本地 GPU 备用解析服务。默认路由虽使用 DeepSeek Vision，仍可随时切回 MinerU。
  mineru:
    image: senkey-mineru:3.4.5
    build:
      context: ./mineru
    profiles: [gpu]
    entrypoint: mineru-api
    command: ["--host", "0.0.0.0", "--port", "8000"]
    environment:
      MINERU_MODEL_SOURCE: local
    ports: ["8080:8000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

volumes:
  postgres_data:
  minio_data:
