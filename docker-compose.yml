services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  document-api:
    build: ./knowledge-document-service
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: ./knowledge-document-service/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINERU_BASE_URL: http://mineru:8080
    ports: ["${API_PORT:-8000}:8000"]
    volumes: [./knowledge-document-service:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  document-worker:
    build: ./knowledge-document-service
    command: dramatiq app.workers.parse_worker
    env_file: ./knowledge-document-service/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@postgres:5432/knowledge
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINERU_BASE_URL: http://mineru:8080
    volumes: [./knowledge-document-service:/app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  # Enable with: docker compose --profile gpu up --build
  # This service must expose the HTTP contract used by MinerUParser.
  mineru:
    image: opendatalab/mineru:latest
    profiles: [gpu]
    ports: ["8080:8080"]

volumes:
  postgres_data:
  minio_data:
